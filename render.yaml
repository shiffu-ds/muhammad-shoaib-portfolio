# Render Blueprint: deploys this portfolio as a free static site.
# In Render: New → Blueprint → pick this repository. See README "Deploy on Render".
services:
  - type: web
    name: muhammad-shoaib-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      # Hashed build assets (JS, CSS, fonts) never change, so browsers can keep them for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
